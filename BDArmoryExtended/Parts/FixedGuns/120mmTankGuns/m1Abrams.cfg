PART
{
// Kerbal Space Program - Part Config
//
//

// --- general parameters ---
name = baha120mmGun
module = Part
author = SuicidalInsanity

// --- asset parameters ---
MODEL
{
	model = BDArmoryExtended/Parts/FixedGuns/120mmTankGuns/120Short
}

rescaleFactor = 1


// --- node definitions ---
node_attach = 0.0, -0.207, 0, 0, -1, 0, 0
CoMOffset = 0.0, 0, -2.25
// --- editor parameters ---
TechRequired = precisionEngineering
entryCost = 12000
cost = 4000
category = none
bdacategory = Guns
subcategory = 0
bulkheadProfiles = srf
title = #loc_BDArmory_part_bahaM1Abrams_title  //M1 Abrams Cannon
manufacturer = #loc_BDArmory_agent_title  //Bahamuto Dynamics
description = #loc_BDArmory_part_bahaM1Abramsfixed_description  //A 120mm cannon on an armored turret. CannonShells
// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 0,1,0,0,1
tags = #loc_BDArmory_part_bahaTankGun_tags 
// --- standard part parameters ---
mass = 1.1
dragModelType = default
maximum_drag = 0.2
minimum_drag = 0.2
angularDrag = 2
crashTolerance = 125
maxTemp = 3600

stagingIcon = SOLID_BOOSTER
MODULE
{
	name = ModuleTurret
	
	yawTransformName = yawTransform
	pitchTransformName = pitchTransform
	
	pitchSpeedDPS = 1
	yawSpeedDPS = 1
	
	minPitch = -0.25
	maxPitch = 0.25
	yawRange = 0.5
	
	smoothRotation = true
	smoothMultiplier = 10
}

MODULE
{
	name = ModuleWeapon

	fireTransformName = fireTransform

	hasDeployAnim = false

	hasFireAnimation = true
	fireAnimName = 120mmFire
	spinDownAnimation = false

	roundsPerMinute = 10
	maxDeviation = 0.05
	maxTargetingRange = 8000
	maxEffectiveDistance = 8000

	ammoName = CannonShells
	bulletType = 120mmBullet; 120mmBulletHE; 120mmBulletCannister
	//bulletType = 120mmBulletSabot; 120mmBulletHEAT; 120mmBulletCannister // Delete above line and uncomment this to use realistic projectiles.
	requestResourceAmount = 1
	canHotSwap = true

	hasRecoil = true
	onlyFireInRange = true
	bulletDrop = true

	weaponType = ballistic
	oneShotWorldParticles = true
	tracerLength = 0
	tracerDeltaFactor = 3.75
	tracerLuminance = 2

	maxHeat = 3600
	heatPerShot = 60
	heatLoss = 740

	fireSoundPath = BDArmory/Parts/m1Abrams/sounds/shot
	overheatSoundPath = BDArmory/Parts/50CalTurret/sounds/turretOverheat
	oneShotSound = true
	showReloadMeter = true
	reloadAudioPath = BDArmory/Parts/m1Abrams/sounds/reload

}
}
