		#loc_BDArmory_part_SwordfishTorpedo_title = “剑鱼”被动声纳鱼雷 // Swordfish Passive Acoustic Torpedo
		#loc_BDArmory_part_SwordfishTorpedo_desc = 中型被动声学制导鱼雷，供舰艇或潜艇使用。它能捕捉敌方舰艇的声学特征。 // A medium-sized Passive Acoustic Homing torpedo, intended for ship or submarine use. Will home in on the audio signature of an enemy naval vessel.

		#loc_BDArmory_part_BDAsonarPod1B_title = BDA 被动声纳吊舱 // BDA Passive Sonar Pod
		#loc_BDArmory_part_BDAsonarPod1B_desc = BDA 被动声纳吊舱适合完全浸没在水下工作，可以用于探测水面和潜水的目标。作为一种被动声纳，它只能探测，不能跟踪，但不会向敌方声纳暴露自己的位置。 // A Sonar Pod can only detect splashed and submerged vessels, mount below waterline for best results. As a passive sonar it can only detect, not track, but it will not reveal its location to enemy sonar.

// Multi Missile Launchers
		//CLS
		#loc_BDArmory_part_bahaCLS_Long = C-VLS-24 导弹荚 // C-VLS-24 MissilePod
		#loc_BDArmory_part_CLS_long_Desc = 小型径向倾斜垂直发射系统，用于攻击机和皇牌空战里的飞机。该型号装载有红外子弹药。 // A small radial canted Vertical Launch System for use on strike craft and Air Domination fighters. This version is loaded with Heatseeking submunitions.
		#loc_BDArmory_part_bahaCLS_Short = C-VLS-12 导弹荚 // C-VLS-12 MissilePod
		#loc_BDArmory_part_CLS_Short_Desc = 小型径向倾斜垂直发射系统，用于攻击机和皇牌空战里的飞机。该型号装有雷达制导子弹药。 // A small radial canted Vertical Launch System for use on strike craft and Air Domination fighters. This version is loaded with Radar-guided submunitions.
		#loc_BDArmory_part_CLS_Short_tags = BDA missile radar ordinance guided launcher pod swarm
		#loc_BDArmory_part_CLS_long_tags = BDA missile heat ordinance guided launcher pod swarm

		//Twin Rail
		#loc_BDArmory_part_twinRail_title = 双联装导弹导轨 // Twin-mount Missile Rail
		#loc_BDArmory_part_bahaTwinRail_desc = 双联导弹导轨，可同时向目标发射一对导弹或炸弹。可以通过在底部导轨节点上安装新弹药来更换已装载的弹药。 // A twin-linked missile launch rail capable of simultaneously launching a pair of missiles or bombs at a target. Users can change out the loaded ordnance by attaching a new munition to the bottom rail node. Will reload if additional ammo supplied from an ordnance magazine.
		#loc_BDArmory_part_twinRail_tags = BDA launcher rail ordinance missile reload hardpoint 

		//Adjustable Reloadable Rail
		#loc_BDArmory_part_reloadableRail_title = 可调节导弹挂架（可重新装填） // Adjustable Missile Rail (reloadable)
		#loc_BDArmory_part_reloadableRail_desc = 用于挂载导弹的挂架。用户可通过在底部挂架节点安装新的弹药来更换挂载的弹药。载具上有弹药库提供额外弹药时能够重新装填。 // A rail for mounting missiles. Users can change out the loaded ordnance by attaching a new munition to the bottom rail node. Will reload if additional ammo supplied from an ordnance magazine.

		//Homing Hydra
		#loc_BDArmory_part_bahaHydraAPKWS_title = 火蛇70制导火箭弹发射器 // Guided Hydra-70
		#loc_BDArmory_part_bahaHydraAPKWS_description = 九头蛇-70 的升级版。仍可容纳和发射 19 枚火箭弹，但这些火箭弹装有制导模块，可以用激光引导火箭弹飞向目标。 // Upgraded version of the venerable Hydra-70. Still holds and fires 19 rockets, but these have guidance packages allowing them to be laser guided to a target.

		//TOW Launcher
		#loc_BDArmory_part_TOWLauncher1_title = 陶式导弹发射器（单联） // TOW Missile Pod
		#loc_BDArmory_part_TOWLauncher2_title = 陶式导弹发射器（双联） // TOW Missile Twin Pod
		#loc_BDArmory_part_TOWLauncher3_title = 陶式导弹发射器（三联） // TOW Missile Triple Pod
		#loc_BDArmory_part_TOWLauncher_desc = 一款采用时尚三角形外形的轻型单发陶式导弹发射器。 // A light single-shot TOW missile launcher in a snazzy triangular formfactor.
		#loc_BDArmory_part_twinRail_tags = BDA launcher rail ordnance missile reload hardpoint 

		#loc_BDArmory_part_VLScellsingle_title = VLS 发射单元 // VLS Cell
		#loc_BDArmory_part_VLScellsingle_desc = 单个垂直发射系统单元。将导弹安装到顶部节点即可装载该类型导弹。导弹需单独购买。载具上有弹药库提供额外弹药时能够重新装填。 // A single Vertical Launch System cell. Attach a missile to the top node to load the launcher with that type of missile. Missiles sold separately. Will reload if additional ammo supplied from an ordnance magazine.

		#loc_BDArmory_part_VLScell_title = 四坑垂直发射（VLS）系统 // Quad VLS Cell
		#loc_BDArmory_part_VLScell_desc = 4 单元垂直发射系统组件。将导弹连接到顶部节点，发射器便可装载该型导弹。导弹另出售。可调整大小。 // A 4-cell Vertical Launch System assembly. Attach a missile to the top node to load the launcher with that type of missile. Missiles sold separately. Can be resized. Will reload if additional ammo supplied from an ordnance magazine.
		#loc_BDArmory_part_VLScell_tags = BDA launcher rail ordinance missile reload hardpoint VLS

		#loc_BDArmory_part_torpLauncher_title = 三联鱼雷发射器 // Triple Torpedo Launcher
		#loc_BDArmory_part_torpLauncher_desc = 安装在甲板上的三联装鱼雷发射器，用于发射重型反舰鱼雷。将鱼雷安装到顶部节点，发射器就能装载该型鱼雷。若用于发射其他弹药保修失效。可调整大小。 // A deck-mounted triple torpedo launcher intended for launching heavy anti-ship torpedoes. Attach a torpedo to the top node to load the launcher with that type of torpedo. Warranty void if used to launch other ordnance. Can be resized.
		#loc_BDArmory_part_torpLauncher_tags = BDA launcher rail ordinance torpedo reload hardpoint 

		#loc_BDArmory_part_CIMS_title = Pavise 近程防御导弹系统 // Pavise CIMS
		#loc_BDArmory_part_CIMS_desc = 一种多单元近程导弹系统，用于半自主防御来袭导弹或小型飞行器。携带13枚滚动弹体导弹并集成有火控雷达进行制导，但仅对短距离有效，不能替代专用搜索雷达。 // A multi-cell Close In Missile System for semi-autonomously defending against incoming missiles or small craft. Carries 13 Rolling Airframe Missiles and an integrated FCS radar to guide them, though it is only effective at short range and does not replace a dedicated search radar.

		#loc_BDArmory_part_GMLR_title = 重型导弹发射塔 // Heavy Missile Launch Rail Turret
		#loc_BDArmory_part_GMLR_desc = 一种双臂导弹发射塔，用于发射地对空导弹及其他大型弹药。集成有用于追踪锁定目标的火控雷达，但不能替代专用搜索雷达。载具上有弹药库提供额外弹药时能够重新装填。 // A twin-arm missile turret intended for launching Surface-to-Air missiles and other large-scale ordnance. Includes integrated FCS radar for tracking locked targets, but it does not replace a dedicated search radar. Will automatically reload if additional ordnance carried in an ordnance magazine is available on the craft.

		#loc_BDArmory_part_SGMLR_title = 单联导弹发射挂架炮塔 // Single Missile Launch Rail Turret
		#loc_BDArmory_part_SGMLR_desc = 一种中型导弹发射导轨系统，用于发射较小的地对空导弹或中大型标准导弹。集成有用于追踪锁定目标的短程基本火控雷达，但不能替代搜索雷达。载具上有弹药库提供额外弹药时能够重新装填。 // A medium-sized guided missile launch rail system for launching smaller Surface-to-Air missiles or medium to large standard missiles. Includes a basic short- ranged integrated FCS radar for tracking locked targets, but it does not replace a search radar. Will automatically reload if additional ordnance carried in an ordnance magazine is available on the craft.

		#loc_BDArmory_part_missileTurretTwin_title = 双联导弹塔 // Twin Missile Turret
		#loc_BDArmory_part_missileTurretTwin_desc = 一种小型、轻量双联导弹发射塔，适用于从卡车后部或类似平台发射轻型导弹。未集成雷达或重新装填机构。 // A small, light-weight twin missile launcher turret for when you need to be able to launch light missiles from the back of a truck or similar. Does not feature integrated radar or reloading mechanisms.

		#loc_BDArmory_part_JernasReload_title = 贾纳斯导弹炮塔（可重装） // Jernas Missile Turret (reloadable)Turret
		#loc_BDArmory_part_JernasReload_description = 一种能够容纳和发射多达8枚中小型导弹的炮塔。配有集成探测与追踪雷达。若安装除导弹外的任何物品，保修失效。载具上有弹药库提供额外弹药时能够重新装填。 // A turret capable of holding and firing up to 8 small to medium sized missiles.  Comes with an integrated detection and tracking radar.  Warranty void if anything except missiles are mounted. Reatures reload capability if additional ordnance carried in an ordnance magazine is available on the craft.

		#loc_BDArmory_part_deployableRail = 可展开导弹吊舱 // Deployable Missile Pod
		#loc_BDArmory_part_deployableReloadRail = 可展开导弹吊舱（可复装） // Deployable Missile Pod (Reloading)
		#loc_BDArmory_part_deployableRail_desc = 带有气壳外壳的可展开导弹导轨。 // A deployable missile rail with aeroshell housing.
		#loc_BDArmory_part_deployableReloadRail_desc = 带有气壳外壳的可展开导弹轨道。发射导弹后可以重新装弹。 // A deployable missile rail with aeroshell housing. Will automatically reload if additional ordnance carried in an ordnance magazine is available on the craft.
		#loc_BDArmory_part_deployableRail_tags = BDA launcher rail deploy pod ordinance missile

		#loc_BDArmory_part_missileMag_title = 弹药库 // Ordnance Magazine
		#loc_BDArmory_part_missileMagC_title = 弹药库（圆柱形） // Ordnance Magazine (Cylinder)
		#loc_BDArmory_part_missileMag_desc = 用于储存弹药，供可复装挂架或发射器使用。将要装入库的弹药安装到节点上。最多可容纳20枚导弹/炸弹。 // A magazine for storing ordnance for use by a reloadable rail or launcher. Attach the munition to be loaded into the magazine to the node. Holds up to 20 misiles/bombs.

//Warheads
		#loc_BDArmory_part_CRWarheadSmall_title = 小型连续杆式战斗部 // Small Coninuous Rod Warhead
		#loc_BDArmory_part_CRWarhead_description = 一个装有炸药的导弹弹头。具有平面型杀伤范围。 // A missile nose cone packed with explosives. Has a planar Area of Effect.
		#loc_BDArmory_part_SCWarheadSmall_title = 小型聚能破甲战斗部 // Small Shaped Charge Warhead
		#loc_BDArmory_part_SCWarhead_description = 一个装有炸药的导弹弹头。专为穿透装甲设计。 // A missile nose cone packed with explosives. This one is designed to penetrate armor.
		#loc_BDArmory_part_NWarheadSmall_title = 小型核战斗部 // Small Nuclear Warhead
		#loc_BDArmory_part_NWarhead_description = 一个装有2万吨当量核战斗部的导弹弹头。 // A missile nose cone packed with a 20 kiloton nuclear warhead.
		#loc_BDArmory_part_FragWarheadSmall_title = 小型破片战斗部 // Small Fragmentation Warhead
		#loc_BDArmory_part_FragWarhead_description = 一个装有炸药和滚珠轴承的导弹弹头。具有锥形杀伤范围。 // A missile nose cone packed with explosives and ball bearings. Has a conical Area of Effect.
		#loc_BDArmory_part_EMPWarheadSmall_title = 小型电磁脉冲战斗部 // Small Elecro-Magnetic Pulse Warhead
		#loc_BDArmory_part_EMPWarhead_description = 一个装有EMP发生器的导弹弹头。 // A missile nose cone fitted with an EMP generator.

// SciFi 
		#loc_BDArmory_part_bahaHoverdisk_title = X-01 径向推进器 // X-01 Radial Repulsorlift
		#loc_BDArmory_part_bahaHoverdisk_desc = 为坎星人带来重力枪的是同一批人，但更加和平地对重力操纵进行应用。只要载具拥有发动机提供动力，该装置就能使其所连接的载具悬停在离地 10 米的高度。如果与 BDA AI连接，它将在AI的默认高度悬停。 // From the same minds that brought Kerbalkind the Gravity gun comes a more peaceful application of gravitic manipulation. This device will cause whatever it is attached to to hover 10m off the ground, as long as the craft possesses an engine to provide power. If linked to a BDA AI, it will instead hover at the AI's default Altitude.

		#loc_BDArmory_part_bahacloakingDevice_title = 隐形装置 // Cloaking Device
		#loc_BDArmory_part_bahacloakingDevice_desc = 从电影制片厂道具仓库 "借来 "的隐形装置。据科学家们的研究，它的工作原理是在一个局部区域内弯曲光线，从而有效地隐藏该区域内的任何东西，使其无法被视觉探测到。 // A cloaking device "borrowed" from a movie studio props warehouse. As far as the boffins have been able to determine, it works by bending light around a localized area, effectively hiding anything within the field from visual detection.

		#loc_BDArmory_part_radarMissiles_tags = BDA missile radar homing a2a ata ordinance weap guided
		#loc_BDArmory_part_heatMissiles_tags = BDA missile heat IR homing a2a ata ordinance weap guided
		#loc_BDArmory_part_laserMissiles_tags = BDA missile laser homing a2g ats ordinance weap guided
		#loc_BDArmory_part_harmMissiles_tags = BDA missile antirad harm homing ordinance weap guided
	}
}