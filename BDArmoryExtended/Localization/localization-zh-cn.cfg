// Fixed Guns
		//YakB .50 Gatling gun
		#loc_BDArmory_part_bahaYakB_title = YakB 航空重机枪 // YakB Aircraft Heavy Machine Gun
		#loc_BDArmory_part_bahaYakB_description = 一挺四管.50口径转管重机枪，以防你觉得勃朗宁AN/M3不够用。附赠可选的气动外壳。使用.50弹药。 // A quad-barrel .50 caliber rotary Heavy Machine Gun, for when the Browning AN/M3 just isn't enough. Comes with optional aeroshell housing. Uses .50cal Ammo.		
		#loc_BDArmory_part_bahaYakB_tags = BDA gun weap turret .50 50cal fiddy gatling

		//20mm Gatling gun
		#loc_BDArmory_part_bahaHephestus_title = 赫菲斯托斯 20mm 转管机炮 // Hephestus 20mm Rotary Gun
		#loc_BDArmory_part_bahaHephestus_description = 一款四管20毫米口径轻型转管机炮，适合想要火神炮但又不想被炮罩遮住的场合。使用20mm弹药。 // A quad-barrel 20mm caliber rotary light autocannon, for when you want a Vulcan, but also want something that isn't hidden inside a shroud. Uses 20mm Ammo.		
		#loc_BDArmory_part_bahaHephestus_tags = BDA gun weap turret 20mm gatling

		//20mm Revolver Cannon
		#loc_BDArmory_part_baha20mmRevolver_title = M20 航空转膛炮 // M20 Aircraft Revolver Cannon
		#loc_BDArmory_part_baha20mmRevolver_description = 一款单管轻型转膛炮，专为飞行器设计，牺牲单发威力换取高射速。附带可选装的气动外壳。使用20mm弹药。 // A single barrel light caliber Revolver Cannon intended for installation on aircraft that sacrifices hitting power for rate of fire. Includes optional aeroshell housing. Uses 20mm Ammo.
		#loc_BDArmory_part_baha20mmRevolver_tags = BDA gun weap 20mm cannon

		//Revolver Cannon
		#loc_BDArmory_part_bahaRevolverCannon_title = M27 航空转膛炮 // M27 Aircraft Revolver Cannon
		#loc_BDArmory_part_bahaRevolverCannon_description = 一门用于安装在飞机上的单管中口径转膛炮，牺牲射速换取威力。附赠可选的气动外壳。使用30mm弹药。 // A single barrel medium caliber Revolver Cannon intended for installation on aircraft that sacrifices rate of fire for hitting power. Includes optional aeroshell housing. Uses 30mm Ammo.
		#loc_BDArmory_part_mauser_tags = BDA gun weap 27mm 30mm cannon

		//Repeater Cannon
		#loc_BDArmory_part_bahaRepeater_title = R2-30 重型双管航炮 // R2-30 Heavy Repeater Cannon
		#loc_BDArmory_part_bahaRepeater_description = 一门后座力驱动双管中口径转管炮。射速随开火时间增长。附赠可选的气动外壳。使用30mm弹药。 // A recoil-driven double barrel medium caliber rotary Cannon. Rate of fire increases the longer the trigger is held. Includes optional aeroshell housing. Uses 30mm Ammo.
		#loc_BDArmory_part_bahaRepeater_tags = BDA gun weap 30mm cannon rotary spool gatling 

		//30mm Gatling Cannon
		#loc_BDArmory_part_bahaGAC-6_title = R6-30 复仇者 转管机炮 // R6-30 Vindicator Rotary Cannon
		#loc_BDArmory_part_bahaGAC-6_description = 一款六管30mm转管机炮。适合想要GAU-8但又不想让炮罩遮住的场合。使用30mm弹药。 // A 6 barrel 30mm rotary cannon. For when you want a GAU-8, but without a housing hiding half the gun. Uses 30mm Ammo.

		//AutoCannon
		#loc_BDArmory_part_bahaNudelman_title = N-37 航炮 // N-37 Aircraft Autocannon
		#loc_BDArmory_part_bahaNudelman_description = 一门重型37mm航炮，以低射速换来了巨大威力。使用37mm弹药。 // A heavy 37mm Autocannon that trades low rate of fire for massive damage. Uses 37mm Ammo.
		#loc_BDArmory_part_bahaN37_tags = BDA gun weap 37mm cannon

		//Antitank Gun
		#loc_BDArmory_part_bahaQF6lb_title = QF-6磅 57mm 反坦克炮 // QF-6P 57mm Anti-Tank Gun
		#loc_BDArmory_part_bahaQF6lb_description =57 mm 6磅炮的缩小版，配有 5 发自动装弹机，用于安装在攻击机或轻型车辆上。使用 57 mm弹药。 // A cut-down 57mm gun fitted with a 5 round autoloader, intended for mounting on strike aircraft or light vehicles. Uses 57mm Ammo.
		#loc_BDArmory_part_bahaQF6lb_tags = BDA gun weap 57mm cannon reload

		//Heavy AutoCannon
		#loc_BDArmory_part_bahaHAutocannon_title = 57mm 重型机关炮 // 57mm Heavy Autocannon
		#loc_BDArmory_part_bahaHAutocannon_description = 一款57mm速射炮，适用于中型车辆或装甲运兵车。使用57mm弹药。 // A 57mm rapid-fire cannon, intended for use on medium-weight vehicles or APCs. Uses 57mmAmmo.
		#loc_BDArmory_part_baha57mm_tags = BDA gun weap 57mm cannon

		//Flak Cannon
		#loc_BDArmory_part_bahaflakcannon_title = F-90 航炮 // F-90 Aircraft Flak Cannon
		#loc_BDArmory_part_bahaflakcannon_desc = 一门轻量化并修改成航炮的90mm防空炮。可以发射像霰弹的高爆弹丸，或者装有近炸引信的防空炮弹药。使用防空炮弹药。 // A 90mm flak cannon that has been lightened and modified to allow it to be mounted on aircraft. Can fire either a shotgun-style spread of explosive pellets, or a proximity-fuzed flak shell. Uses Flak Shells.
		#loc_BDArmory_part_bahaflakcannon_tags = BDA gun weap 90mm cannon flak shotgun cannister shotty

		//light tank Gun	
		#loc_BDArmory_part_bahaM4_76mm_title = 76mm L/38 坦克炮 // 76mm L/38 Cannon
		#loc_BDArmory_part_bahaM4_76mm_description = 一款38倍径76mm轻型坦克炮。炮塔和旋转机构需单独购买。使用76mm弹药。 // A 38 caliber 76mm light tank gun. Turret and traverse mechanisms sold separately. Uses 76mmAmmo.
		#loc_BDArmory_part_bahaM4_76mm_tags = BDA gun weap 76mm cannon tank

		//light artillery Gun	
		#loc_BDArmory_part_baha105mmHowitzer_title = 105mm L/45 榴弹炮 // 105mm L/45 Howitzer
		#loc_BDArmory_part_baha105mmHowitzer_description = 一款45倍径105mm火炮。炮塔和旋转机构需单独购买。使用炮弹(CannonShells)。 // A 45 caliber 105mm gun. Turret and traverse mechanisms sold separately. Uses CannonShells.
		#loc_BDArmory_part_baha105mmHowitzer_tags = BDA gun weap 105mm cannon tank

		//Recoilless Gun
		#loc_BDArmory_part_baha105mmRCL_title = 105mm 无后坐力炮 // 105mm Recoilless Gun
		#loc_BDArmory_part_baha105mmRCL_description = 一款轻型105mm无后坐力炮。比传统火炮轻得多但射程也短得多。使用炮弹(CannonShells)。 // A lightweight 105mm recoilless gun. Much lighter than a traditional cannon, but also much shorter ranged. Uses CannonShells.

		//tank Gun		
		#loc_BDArmory_part_bahaM1Abramsfixed_description = 一款40倍径120mm滑膛坦克炮。炮塔和旋转机构需单独购买。使用炮弹(CannonShells)。 // A 40 caliber 120mm smoothbore tank gun. Turret and traverse mechanisms sold separately. Uses CannonShells.
		#loc_BDArmory_part_bahaTankGun_tags = BDA gun weap 120mm cannon tank cannister sabot

		//tank Gun	
		#loc_BDArmory_part_bahaM2Abramsfixed_title = M2 120mm L/58 坦克炮 // M2 120mm L/58 Cannon
		#loc_BDArmory_part_bahaM2Abramsfixed_description = 一款长身管120mm滑膛坦克炮。炮塔和旋转机构需单独购买。使用炮弹(CannonShells)。 // A longbarrel 120mm smoothbore tank gun. Turret and traverse mechanisms sold separately. Uses CannonShells.

		//Aircraft Railgun
		#loc_BDArmory_part_bahaRailgun_title = 航空轨道炮 // Aircraft Railgun
		#loc_BDArmory_part_bahaRailgun_description = 一种用于飞机的远程火药动力-电磁混合轨道炮。为了使它的尺寸缩小到不给飞机动力装置造成压力，我们做出了取舍，这导致了较长的充能时间，所以最好瞄准一点。 // A long-range gunpowder-electric hybrid railgun intended for use on aircraft. Sacrifices to allow it to be scaled down enough to not strain aircraft powerplants result in a long cycle time, so accuracy is a must.
		#loc_BDArmory_part_bahaRailgun_tags = BDA gun weap 37mm rail snipe charge electric EC
		#loc_BDArmory_part_bahaBurstRailgun_description = 一种用于飞机的远程火药动力-电磁混合轨道炮。用旋转电容器组取代供电装置后，可实现连发射击，而射击散布和武器质量略有增加。 // A long-range gunpowder-electric hybrid railgun for aircraft. By replacing the power supply with a rotating capacitor bank, burst fire is achieved with a slight increase in dispersion and weapon mass.

		//howitzer
		#loc_BDArmory_part_baha155Fixed_title = 155mm L/40 榴弹炮 // 155mm L/40 Howitzer
		#loc_BDArmory_part_baha155Fixed_description = 一款中型野战炮，可安装到多种平台上（但说实话有些人肯定看见他就想把它塞到飞机上了）。炮架/旋转机构需单独购买。使用炮弹(CannonShells)。 // A medium-weight field gun that can be mounted to various things (but let's be honest - you're going to stick this on a plane first opportunity). Mountings/traverse mechanisms sold separately. Uses CannonShells.

		//howitzer
		#loc_BDArmory_part_baha203Fixed_title = 203mm L/21 榴弹炮 // 203mm L/21 Howitzer
		#loc_BDArmory_part_baha203Fixed_description = 一款海军口径重型短管火炮。若安装到飞艇而非水面舰艇上，保修失效。使用炮弹(CannonShells)。 // A naval-caliber heavy short barrel artillery piece. Warranty void if attached to airships instead of water ships. Uses CannonShells.

//Lasers
		//Torsion Cannon
		#loc_BDArmory_part_Tractorbeam_title = 拖曳炮 // Torsion Cannon
		#loc_BDArmory_part_Tractorbeam_description = 在一个曾用作物理实验室的废弃仓库内的角落发现了一个密封的箱子，里面藏有这个武器。我们不知道它是如何工作的，但发射时它能将物体拉向自己。使用电能。 // A weapon we found in a sealed crate hidden in a back corner of an abandoned warehouse that once belonged to a physics lab. We have no idea how it works, but it's capable of pulling objects towards itself when fired. Uses Electric Charge.
		#loc_BDArmory_part_Tractorbeam_tags = BDA laser weap beam grav pull tractor electric EC

		//Chemical Laser
		#loc_BDArmory_part_bahaTLS_title = 航空化学激光器 // Aircraft Chemical Laser
		#loc_BDArmory_part_bahaTLS_description = 一种战术尺寸的化学激光武器，已缩小到足以在飞机上使用。使用内置弹药供应，不依赖外部弹药箱，但也无法重新装弹。 // A tactical-scale chemical laser weapon that has been scaled down enough for use on aircraft. Uses an onboard supply of ammunition and does not rely on external ammo boxes, but cannot be reloaded.
		#loc_BDArmory_part_bahaTLS_tags = BDA laser beam weap turret reload

		//Aircraft Plasma Beam
		#loc_BDArmory_part_bahaPlasmabeam_title = 航空等离子激光 // Aircraft Plasma Beam
		#loc_BDArmory_part_bahaPlasmabeam_description = 一种战术尺寸的短射程等离子体光束发射器，专为在飞机上使用而设计。由于大气与光束的相互作用，等离子体的伤害会随着目标距离的增加而降低。使用内置弹药供应，无法在飞行中重新装弹。 // A tactical-scale short-range plasma beam designed for use on aircraft. Due to atmospheric interaction with the beam, plasma damage falls off the further away the target is. Uses an internal supply of ammunition, and cannot be reloaded in flight.
		#loc_BDArmory_part_bahaPlasmabeam_tags = BDA laser weap beam pulse reload energy

		//PulseLaser
		#loc_BDArmory_part_bahaPSL_title = 脉冲激光器 // Pulse Laser
		#loc_BDArmory_part_bahaPSL_description = 一种能够持续射击的低功率脉冲激光武器。电容系统使其可以接入飞行器的电源系统而不会造成过大负担，但长时间运行仍需专用的电池储备或发电能力。开火前需要短暂充能，但充能后可保持短时间待发，允许短暂停火而无需重新充能。使用电力。 // A lower-power pulse laser weapon capable of sustained fire. Capacitor systems permit the weapon to tie into a craft's powerplant without overly straining them, but extended operation will require dedicated battery reserves or generation capacity. Requires a brief charge period before it can fire, but can remain charged up for a short time, permitting brief pauses in firing without needing to recharge the weapon. Uses Electric Charge.

		//Tesla Cannon
		#loc_BDArmory_part_bahaTesla_title = 特斯拉炮 // Tesla Cannon
		#loc_BDArmory_part_bahaTesla_description = 一门冒蓝电的炮，有了这个还想要啥？ // It's a gun. It shoots lightning. What more do you need?
		#loc_BDArmory_part_bahaTesla_tags = BDA laser weap electric EC lighting electro EMP 

		//Arc Caster
		#loc_BDArmory_part_bahaElectro_title = 电弧发射器 // Arc Caster
		#loc_BDArmory_part_bahaElectro_description = 一种能够发射持续性“光束”电流的电子激光器。不会对目标造成物理伤害，而是造成EMP伤害，使目标暂时停机失效。使用电力。 // An electrolaser capable of firing a sustained 'beam' of electricity. Does no physical damage to a target, but instead does EMP damage that will temporarily shut down and disable a target. Uses Electric Charge.

		//Small Continuous Laser
		#loc_BDArmory_part_bahaSLas_title = 小型连续激光器 // Small Continuous Laser

		//Heavy Pulse Laser
		#loc_BDArmory_part_bahaMLas_title = 重型脉冲激光器 // Heavy Pulse Laser
		#loc_BDArmory_part_bahaMLas_desc = 一种脉冲激光武器，以较高的能量输出换取较慢的射速和更高的能耗。持续射击需要专用发电机为武器供能。使用电力。 // A pulse laser weapon trading higher power output for slower rate of fire and increased energy usage. Sustained fire will require a dedicated powerplant to supply the weapon. Uses Electric Charge.

		//Laser Cannon
		#loc_BDArmory_part_bahaLLas_title = 激光炮 // Laser Cannon
		#loc_BDArmory_part_bahaLLas_desc = 一种工作原理类似于化学激光器的光束激光器。发射强大的光束，持续时间短，之后必须冷却并重新充能。使用电力。 // A beam laser working off of similar principles to the Chemical Laser. Fires a powerful beam for a short duration before it must cool down and recharge. Uses Electric Charge.

		//Scatter laser
		#loc_BDArmory_part_bahascatterLas_title = 散射激光器 // Scatter laser
		#loc_BDArmory_part_bahascatterLas_description = 有什么比激光更好？9个激光器捆在一起，做成一把激光霰弹枪。使用电力。 // What's better than a laser? 9 lasers bolted together to make a laser shotgun. Uses ElectricCharge.

		//Flak Laser
		#loc_BDArmory_part_bahaflakLas_title = 爆破激光 // Flak Laser
		#loc_BDArmory_part_bahaflakLas_description = 发射能量极高的激光脉冲，能够使被击中材料爆炸性汽化，对目标区域造成额外伤害。使用电力。 // Fires a very high power laser pulse capable of causing hit material to explosively vaporize, contributing extra damage to the target area. Uses Electric Charge.

//Turrets
		//37mm
		#loc_BDArmory_part_baha37mmTurret_title = 37mm L/39 炮塔 // 37mm L/39 Turret
		#loc_BDArmory_part_baha37mmTurret_desc = 一个气动外壳里装了一门轻型双管37mm炮。主要用于近点防御或者攻击小型载具。使用37mm弹药。 // A light twin-barreled 37mm autocannon placed in an aerodynamic shell. Primarily useful as light point-defense or providing a basic level of offensive capability to small vessels. Uses 37mmAmmo.
		#loc_BDArmory_part_baha37mmTurret_tags = BDA gun weap turret 37mm cannon PD AA

		//37mm CIWS
		#loc_BDArmory_part_baha37mmCIWS_title = 37mm 近防炮 // 37mm CIWS Turret
		#loc_BDArmory_part_baha37mmCIWS_desc = 一门重型大口径近防炮，用于提供对空及对轻型舰艇近点防御，还可以拦截在途弹药。附带内置弹药箱和气动外壳。使用37mm弹药。 // A heavy, large-caliber CIWS turret for providing point defense against fighters and other light craft, in addition to intercepting incoming munitions. Features an onboard ammunition supply and a sleek aeroshell housing. Uses 37mmAmmo.
		#loc_BDArmory_part_baha37mmCIWS_tags = BDA gun weap turret 37mm cannon PD CIWS AA

		//Bofors
		#loc_BDArmory_part_baha57mmTurret_title = 57mm L/32 炮塔 // 57mm L/32 Turret
		#loc_BDArmory_part_baha57mmTurret_desc =一个气动外壳里装了一门57mm速射炮。主要作为炮艇的主武器，或者更大的载具上的防空炮。使用57mm弹药。 // A light 57mm rapid-fire cannon placed in an aerodynamic shell, intended for use as primary armament on heavy gunships and an air-defense weapon on larger vessels. Uses 57mmAmmo.
		#loc_BDArmory_part_bofors_tags = BDA gun weap turret 57mm cannon DP AAA dual reload

		//3in Turret
		#loc_BDArmory_part_baha76mmTurret_title = 76mm L/25 炮塔 // 76mm L/25 Turret
		#loc_BDArmory_part_baha76mmTurret_desc = 在一个低矮的炮塔里塞进了两门短管76mm速射炮。可以作为炮艇的主要武器或者在更大的载具上作为对空-对海两用次要武器使用。使用76mm弹药。 // A pair of light shortbarrel 76mm autoloading cannon placed in a low-profile turret, intended for heavy armament on gunships and as dual-purpose light secondary armament on larger craft. Uses 76mmAmmo.
		#loc_BDArmory_part_76mm_tags = BDA gun weap turret 76mm cannon DP AAA dual reload

		//100mm Turret
		#loc_BDArmory_part_baha100mmTurret_title = 100mm L/30 重型炮塔 // 100mm L/30 Heavy Turret
		#loc_BDArmory_part_baha100mmTurret_desc = 简化的双管自动装填 100 mm炮塔，安装在一个气动外壳中，可用作重型水面舰艇和空中巡洋舰的主要武器。使用火炮弹药（CannonShells）。 // A stripped down twin barrel autoloading 100mm turret, placed in an aerodynamic turret housing for use as a primary armament on heavy surface craft and aerial cruisers. Uses CannonShells.
		#loc_BDArmory_part_100mmTurret_tags = BDA gun weap turret 100mm cannon reload

		//130mm Turret
		#loc_BDArmory_part_baha130mmTurret_title = 130mm L/30 重型炮塔 // 130mm L/30 Heavy Turret
		#loc_BDArmory_part_baha130mmTurret_desc =一门对付厚重目标的130mm火炮，简化后塞进了一个气动外壳里。威力巨大，但很重且射速慢。使用火炮弹药（CannonShells）。 // A heavy 130mm gun for use against hardened targets, stripped down and placed in an aerodynamic turret to permit aerial use. Powerful, but heavy and slow firing. Uses CannonShells.
		#loc_BDArmory_part_130mmTurret_tags = BDA gun weap turret 130mm cannon reload

//Countermeasures		
		//APS
		#loc_BDArmory_part_bahaPalash_title = 主动保护系统 // Active Protection System
		#loc_BDArmory_part_bahaPalash_description = 三发装的主动防护系统，旨在拦截射来的坦克炮弹。 // A three shot Active Protection System designed to intercept incoming tank rounds.
		#loc_BDArmory_part_bahaPalash_tags = BDA APS PD protect active

		#loc_BDArmory_part_bahaPDC_title = 气泡型.50 近防炮塔 // Point Defense Blister Turret
		#loc_BDArmory_part_bahaPDC_description = 炮塔式 .50 口径点防御机枪，开启防护模式后可自动拦截来袭导弹。使用 .50 口径弹药。 // A turreted 0.50 cal Point Defense machine gun that will automatically intercept incoming missiles when Guard mode is enabled. Uses .50 cal Ammo.
		#loc_BDArmory_part_bahaPDC_tags = BDA PD protect active CIWS APS point .50 cal turret 

//Ammo Drums
		#loc_BDArmory_part_baha50CalAmmoDrum_title = .50 CAL 弹药箱 // 50cal Ammunition Magazine
		#loc_BDArmory_part_baha50CalAmmoDrum_desc = 包含4800发12.7mm子弹的弹药箱。 // Ammo magazine containing 4800 12.7mm Bullets.
		#loc_BDArmory_part_baha20mmAmmoDrum_title = 20mm 弹药箱 // 20mm Ammunition Magazine
		#loc_BDArmory_part_baha20mmAmmoDrum_desc = 包含3000发20mm炮弹的弹药箱。 // Ammo magazine containing 3000 20mm Shells.
		#loc_BDArmory_part_baha25mmAmmoDrum_title = 25mm 弹药箱 // 25mm Ammunition Magazine
		#loc_BDArmory_part_baha25mmAmmoDrum_desc = 包含2000发25mm炮弹的弹药箱。 // Ammo magazine containing 2000 25mm Shells.
		#loc_BDArmory_part_baha30mmShellDrum_title = 30mm 弹药箱 // 30mm Ammunition Magazine
		#loc_BDArmory_part_baha30mmShellDrum_desc = 包含1200发30mm炮弹的弹药箱。 // Ammo magazine containing 1200 30mm Shells.
		//37mm Ammunition Box
		#loc_BDArmory_part_baha37mmAmmo_title = 37mm 弹药箱 // 37mm Ammunition Box
		#loc_BDArmory_part_baha37mmAmmo_description = 一个装了160发37x155mm炮弹的弹药箱。你知道一发这玩意儿有多大吗？ // Ammo box containing 160 37x155mm rounds. You know how big those are?
